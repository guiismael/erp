services:
  db:
    image: mariadb:12.3.2
    restart: on-failure
    environment:
      MYSQL_DATABASE: erp-refatorado
      MYSQL_ROOT_PASSWORD: root
    # MYSQL_ALLOW_EMPTY_PASSWORD: yes
    command:
      - --character-set-server=utf8mb3
      - --collation-server=utf8mb3_general_ci
    volumes:
      - ./legado:/docker-entrypoind-initdb.d
    ports:
      - 3306:3306
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--su-mysql",
          "--connect",
          "--innodb_initialized",
        ]
      interval: 20s
      timeout: 10s
      start_period: 10s
      retries: 5

  db_pg:
    image: postgres:16.0-alpine3.18
    restart: on-failure
    environment:
      POSTGRES_DB: erp-refatorado
      POSTGRES_PASSWORD: postgres
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  db_mongo:
    image: mongo:8.3
    restart: on-failure
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: erp-refatorado
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    ports:
      - 27017:27017
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--username",
          "root",
          "--password",
          "root",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  whodb:
    image: clidey/whodb:latest
    restart: on-failure
    ports:
      - 8080:8080
    environment:
      - PORT=8080
      - WHODB_LOG_LEVEL=info
      - WHODB_ENCRYPTION_KEY=313e598dd986dd14e04ab74cd75d7bfe083af7be41df8a1a701892eb8c37fb20
    depends_on:
      db:
        condition: service_healthy
      db_pg:
        condition: service_healthy
      db_mongo:
        condition: service_healthy

  rabbit:
    image: rabbitmq:3-management
    restart: on-failure
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 20s
      timeout: 10s
      retries: 5

